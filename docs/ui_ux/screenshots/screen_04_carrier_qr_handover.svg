<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect width="375" height="812" fill="#0B0F19"/>

  <!-- Top App Navigation -->
  <rect y="44" width="375" height="56" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <path d="M 28 72 L 20 64 L 28 56" fill="none" stroke="#F9FAFB" stroke-width="2" stroke-linecap="round"/>
  <text x="44" y="69" class="t" font-size="16" font-weight="700" fill="#F9FAFB">Teslimat Doğrulama (QR)</text>
  <rect x="274" y="58" width="85" height="28" rx="4" fill="#0B0F19" stroke="#374151" stroke-width="1"/>
  <text x="316" y="76" class="t" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">Çevrimdışı</text>

  <!-- Optical Camera Viewfinder Reticle -->
  <rect x="36" y="120" width="303" height="303" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  
  <!-- Minimalist Corner Brackets -->
  <path d="M 56 150 L 56 136 L 70 136" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 319 150 L 319 136 L 305 136" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 56 393 L 56 407 L 70 407" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 319 393 L 319 407 L 305 407" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- Clean QR Matrix Graphics -->
  <rect x="96" y="180" width="183" height="183" rx="6" fill="#FFFFFF"/>
  <rect x="114" y="198" width="40" height="40" fill="#000"/>
  <rect x="122" y="206" width="24" height="24" fill="#FFF"/>
  <rect x="128" y="212" width="12" height="12" fill="#000"/>

  <rect x="221" y="198" width="40" height="40" fill="#000"/>
  <rect x="229" y="206" width="24" height="24" fill="#FFF"/>
  <rect x="235" y="212" width="12" height="12" fill="#000"/>

  <rect x="114" y="305" width="40" height="40" fill="#000"/>
  <rect x="122" y="313" width="24" height="24" fill="#FFF"/>
  <rect x="128" y="319" width="12" height="12" fill="#000"/>

  <!-- Scanning Guide Line -->
  <line x1="60" y1="271" x2="315" y2="271" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>

  <text x="187" y="445" class="t" font-size="12" font-weight="500" fill="#9CA3AF" text-anchor="middle">Saha yetkilisinin dinamik karekodunu hizalayın</text>
  <text x="187" y="462" class="mono" font-size="11" fill="#38BDF8" text-anchor="middle">Kriptografik İmzalı: ECDSA P-256</text>

  <!-- Verified Receipt Card -->
  <rect x="16" y="482" width="343" height="180" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <circle cx="38" cy="510" r="10" fill="#065F46"/>
  <path d="M 35 510 L 37 512 L 41 508" stroke="#34D399" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="56" y="514" class="t" font-size="14" font-weight="700" fill="#F9FAFB">Doğrulama Başarılı</text>

  <line x1="28" y1="532" x2="330" y2="532" stroke="#1F2937" stroke-width="1"/>
  <text x="28" y="554" class="t" font-size="12" fill="#9CA3AF">Yetkili Alıcı:</text>
  <text x="330" y="554" class="t" font-size="12" font-weight="600" fill="#F9FAFB" text-anchor="end">Ahmet Demir (Antakya Hub-2)</text>
  <text x="28" y="578" class="t" font-size="12" fill="#9CA3AF">Teslim Kalemi:</text>
  <text x="330" y="578" class="t" font-size="12" font-weight="600" fill="#F9FAFB" text-anchor="end">12 Palet Su, 50 Çadır</text>
  <text x="28" y="602" class="t" font-size="12" fill="#9CA3AF">İrsaliye Hash:</text>
  <text x="330" y="602" class="mono" font-size="11" fill="#9CA3AF" text-anchor="end">0x8f2a...c419</text>
  <text x="28" y="626" class="t" font-size="12" fill="#9CA3AF">Kayıt Modu:</text>
  <text x="330" y="626" class="t" font-size="12" font-weight="600" fill="#F59E0B" text-anchor="end">Yerel Kuyruğa Alındı</text>

  <!-- Complete Button -->
  <rect x="16" y="674" width="343" height="48" rx="8" fill="#10B981"/>
  <text x="187" y="704" class="t" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Teslimatı Tamamla ve Onayla</text>
</svg>