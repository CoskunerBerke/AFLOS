  <circle cx="36" cy="139" r="10" fill="#16A34A" opacity="0.2"/>
  <text x="54" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F172A">Konum Otomatik Alindi (GPS)</text>
  <text x="54" y="150" font-family="sans-serif" font-size="11" fill="#64748B">Hatay, Antakya, Odabasi Mah. (&#177;8m)</text>
  <text x="340" y="142" font-family="sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="end">Degistir</text>

