<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <filter id="subtle" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="375" height="812" fill="#F8FAFC"/>

  <!-- iOS Status Bar -->
  <rect width="375" height="44" fill="#FFFFFF"/>
  <text x="32" y="30" class="t" font-size="14" font-weight="600" fill="#0F172A">09:41</text>
  <!-- Signal & Battery Icons -->
  <path d="M 315 28 L 315 22 M 319 28 L 319 19 M 323 28 L 323 16 M 327 28 L 327 13" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="336" y="18" width="22" height="12" rx="3.5" fill="none" stroke="#0F172A" stroke-width="1.2"/>
  <rect x="338" y="20" width="14" height="8" rx="2" fill="#0F172A"/>

  <!-- Top App Navigation -->
  <rect y="44" width="375" height="56" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="16" y="58" width="28" height="28" rx="6" fill="#DC2626"/>
  <!-- Emergency Flame Icon inside badge -->
  <path d="M 30 65 C 28 69 25 72 25 75 C 25 78 27 80 30 80 C 33 80 35 78 35 75 C 35 71 31 68 30 65 Z" fill="#FFFFFF"/>
  <text x="52" y="74" class="t" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="-0.3">AFLOS</text>
  <text x="52" y="86" class="t" font-size="10" font-weight="500" fill="#64748B">Afet Koordinasyon &amp; Destek</text>

  <!-- Language Switch Pill -->
  <rect x="295" y="58" width="64" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="327" y="76" class="t" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">TR · EN</text>

  <!-- Location Bar (Clean Card) -->
  <rect x="16" y="112" width="343" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#subtle)"/>
  <!-- Pin Icon -->
  <circle cx="34" cy="136" r="3" fill="#DC2626"/>
  <path d="M 34 128 C 30 128 27 131 27 135 C 27 140 34 146 34 146 C 34 146 41 140 41 135 C 41 131 38 128 34 128 Z" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  <text x="50" y="133" class="t" font-size="11" font-weight="500" fill="#64748B">Tespit Edilen Acil Konum</text>
  <text x="50" y="148" class="t" font-size="13" font-weight="600" fill="#0F172A">Antakya, Hatay · Odabaşı Mah.</text>
  <text x="343" y="141" class="t" font-size="12" font-weight="600" fill="#2563EB" text-anchor="end">Değiştir</text>

  <!-- Section Header -->
  <text x="16" y="184" class="t" font-size="15" font-weight="700" fill="#0F172A">Acil İhtiyaç Kategorisi</text>
  <text x="16" y="200" class="t" font-size="12" font-weight="400" fill="#64748B">Sahaya sevk edilecek malzeme türlerini seçin</text>

  <!-- 2-Column Clean Category Grid -->
  <!-- 1. Su (Selected) -->
  <rect x="16" y="214" width="166" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <!-- Droplet Icon -->
  <path d="M 36 244 C 36 244 44 254 44 259 C 44 264 40.5 267 36 267 C 31.5 267 28 264 28 259 C 28 254 36 244 36 244 Z" fill="#2563EB" stroke="#2563EB" stroke-width="1.2"/>
  <text x="54" y="246" class="t" font-size="13" font-weight="600" fill="#1E3A8A">İçme Suyu</text>
  <text x="54" y="262" class="t" font-size="11" fill="#3B82F6">Koli / Damacana</text>
  <!-- Blue Check circle -->
  <circle cx="166" cy="230" r="7" fill="#2563EB"/>
  <path d="M 163 230 L 165 232 L 169 228" stroke="#FFFFFF" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- 2. Çadır (Selected) -->
  <rect x="193" y="214" width="166" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <!-- Tent Icon -->
  <path d="M 213 266 L 221 246 L 229 266 Z M 221 246 L 221 266" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="233" y="246" class="t" font-size="13" font-weight="600" fill="#1E3A8A">Barınma / Çadır</text>
  <text x="233" y="262" class="t" font-size="11" fill="#3B82F6">Termal Kışlık</text>
  <circle cx="343" cy="230" r="7" fill="#2563EB"/>
  <path d="M 340 230 L 342 232 L 346 228" stroke="#FFFFFF" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- 3. Hazır Gıda -->
  <rect x="16" y="294" width="166" height="72" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#subtle)"/>
  <!-- Food / Can Icon -->
  <rect x="28" y="322" width="16" height="20" rx="3" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <line x1="28" y1="327" x2="44" y2="327" stroke="#64748B" stroke-width="1"/>
  <text x="54" y="326" class="t" font-size="13" font-weight="600" fill="#0F172A">Hazır Gıda</text>
  <text x="54" y="342" class="t" font-size="11" fill="#64748B">Konserve / Kumanya</text>

  <!-- 4. Medikal / İlk Yardım -->
  <rect x="193" y="294" width="166" height="72" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#subtle)"/>
  <!-- Medical Cross Icon -->
  <path d="M 218 322 L 224 322 L 224 316 L 230 316 L 230 322 L 236 322 L 236 328 L 230 328 L 230 334 L 224 334 L 224 328 L 218 328 Z" fill="#DC2626"/>
  <text x="242" y="326" class="t" font-size="13" font-weight="600" fill="#0F172A">İlk Yardım</text>
  <text x="242" y="342" class="t" font-size="11" fill="#64748B">İlaç &amp; Pansuman</text>

  <!-- 5. Isınma / Jeneratör -->
  <rect x="16" y="374" width="166" height="72" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#subtle)"/>
  <!-- Heater Icon -->
  <rect x="28" y="402" width="18" height="18" rx="2" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <line x1="32" y1="406" x2="32" y2="416" stroke="#64748B" stroke-width="1.2"/>
  <line x1="37" y1="406" x2="37" y2="416" stroke="#64748B" stroke-width="1.2"/>
  <line x1="42" y1="406" x2="42" y2="416" stroke="#64748B" stroke-width="1.2"/>
  <text x="54" y="406" class="t" font-size="13" font-weight="600" fill="#0F172A">Isınma &amp; Enerji</text>
  <text x="54" y="422" class="t" font-size="11" fill="#64748B">Soba / Jeneratör</text>

  <!-- 6. Bebek Bakım -->
  <rect x="193" y="374" width="166" height="72" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#subtle)"/>
  <circle cx="225" cy="410" r="7" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <path d="M 221 423 C 221 418 229 418 229 423" stroke="#64748B" stroke-width="1.5" fill="none"/>
  <text x="242" y="406" class="t" font-size="13" font-weight="600" fill="#0F172A">Bebek &amp; Hijyen</text>
  <text x="242" y="422" class="t" font-size="11" fill="#64748B">Mama, Bez, Hijyen</text>

  <!-- Person Stepper Box -->
  <rect x="16" y="460" width="343" height="72" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#subtle)"/>
  <text x="32" y="488" class="t" font-size="13" font-weight="600" fill="#0F172A">Kişi Sayısı</text>
  <text x="32" y="506" class="t" font-size="12" fill="#64748B">1 Bebek, 1 Yaşlı Mevcut</text>

  <!-- Minimal Stepper Controls -->
  <rect x="238" y="478" width="36" height="36" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="248" y1="496" x2="264" y2="496" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  <text x="290" y="502" class="t" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">4</text>
  <rect x="307" y="478" width="36" height="36" rx="6" fill="#0F172A"/>
  <line x1="317" y1="496" x2="333" y2="496" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="325" y1="488" x2="325" y2="504" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Priority Flags (Clean Checkbox Row) -->
  <rect x="16" y="546" width="343" height="88" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
  <text x="32" y="570" class="t" font-size="12" font-weight="700" fill="#C2410C">ÖNCELİK KRİTERLERİ</text>
  
  <rect x="32" y="582" width="16" height="16" rx="4" fill="#C2410C"/>
  <path d="M 35 590 L 38 593 L 45 586" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="56" y="595" class="t" font-size="12" font-weight="500" fill="#7C2D12">Açıkta / Soğukta Donma Riski (-2°C)</text>

  <rect x="32" y="606" width="16" height="16" rx="4" fill="#C2410C"/>
  <path d="M 35 614 L 38 617 L 45 610" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="56" y="619" class="t" font-size="12" font-weight="500" fill="#7C2D12">Enkazdan Yeni Çıkarılmış / Yaralı Var</text>

  <!-- Primary Solid Action Button -->
  <rect x="16" y="650" width="343" height="48" rx="8" fill="#DC2626"/>
  <text x="187" y="680" class="t" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">Acil İhtiyaç Talebini Gönder</text>
  <text x="187" y="714" class="t" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle">Hesap gerekmez · GSM şebekesi yoksa SMS ile iletilir</text>

  <!-- Bottom Navigation Bar -->
  <rect y="736" width="375" height="76" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Nav Item 1: Active -->
  <circle cx="62" cy="762" r="3" fill="#DC2626"/>
  <path d="M 54 772 L 70 772" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
  <text x="62" y="788" class="t" font-size="10" font-weight="600" fill="#DC2626" text-anchor="middle">Talep Et</text>
  
  <!-- Nav Item 2 -->
  <circle cx="187" cy="762" r="7" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="192" y1="767" x2="198" y2="773" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <text x="187" y="788" class="t" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Durum Takip</text>

  <!-- Nav Item 3 -->
  <path d="M 304 766 C 304 762 308 758 312 758 C 316 758 320 762 320 766 C 320 772 312 776 312 776 C 312 776 304 772 304 766 Z" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="312" y="788" class="t" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Gönüllü Ol</text>
</svg>