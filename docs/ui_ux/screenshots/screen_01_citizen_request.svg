  <rect x="16" y="470" width="343" height="80" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="32" y="498" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Etkilenen Kisi Sayisi</text>
  <text x="32" y="515" font-family="sans-serif" font-size="11" fill="#64748B">1 Bebek, 1 Yasli vatandas var</text>
  <rect x="230" y="488" width="36" height="36" rx="8" fill="#F1F5F9"/>
  <text x="248" y="512" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">-</text>
  <text x="285" y="513" font-family="sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="middle">4</text>
  <rect x="305" y="488" width="36" height="36" rx="8" fill="#2563EB"/>
  <text x="323" y="512" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">+</text>

  <!-- Urgency Flags -->
  <rect x="16" y="562" width="343" height="84" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="32" y="586" font-family="sans-serif" font-size="12" font-weight="800" fill="#991B1B">&#9888; Oncelikli Durum Bildirimi:</text>
  <rect x="32" y="598" width="16" height="16" rx="4" fill="#DC2626"/>
  <text x="40" y="610" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">&#10003;</text>
  <text x="56" y="611" font-family="sans-serif" font-size="11" font-weight="600" fill="#7F1D1D">Acikta / Donma Riski Altinda (-3&#176;C)</text>
  <rect x="32" y="622" width="16" height="16" rx="4" fill="#DC2626"/>
  <text x="40" y="634" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">&#10003;</text>
  <text x="56" y="635" font-family="sans-serif" font-size="11" font-weight="600" fill="#7F1D1D">Yarali veya Kronik Hasta Mevcut</text>

  <!-- Big Red Submit Button -->
  <rect x="16" y="662" width="343" height="54" rx="14" fill="#DC2626" filter="url(#cardShadow)"/>
  <text x="187" y="695" font-family="sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ACIL YARDIM TALEBI OLUSTUR</text>
  <text x="187" y="732" font-family="sans-serif" font-size="11" fill="#64748B" text-anchor="middle">&#128274; Hesap gerekmez. Konum ve telefon KVKK ile korunur.</text>

  <!-- Bottom Navigation Bar -->
  <rect y="748" width="375" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="62" y="775" font-size="18" text-anchor="middle">&#128680;</text>
  <text x="62" y="792" font-family="sans-serif" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Talep Et</text>
  <text x="187" y="775" font-size="18" text-anchor="middle">&#128269;</text>
  <text x="187" y="792" font-family="sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Durum Takip</text>
  <text x="312" y="775" font-size="18" text-anchor="middle">&#128153;</text>
  <text x="312" y="792" font-family="sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Gönüllü Ol</text>
</svg>