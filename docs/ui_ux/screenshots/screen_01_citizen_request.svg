  <rect x="195" y="298" width="164" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="210" y="330" font-size="22">&#129657;</text>
  <text x="240" y="329" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Ilk Yardim</text>
  <text x="240" y="346" font-family="sans-serif" font-size="10" fill="#64748B">Medikal / Sargi</text>

