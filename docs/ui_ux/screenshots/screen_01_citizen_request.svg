  <rect x="16" y="382" width="164" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="32" y="414" font-size="22">&#128118;</text>
  <text x="62" y="413" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Bebek Bakim</text>
  <text x="62" y="430" font-family="sans-serif" font-size="10" fill="#64748B">Mama, Bez</text>

