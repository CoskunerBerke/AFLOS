  <rect x="195" y="382" width="164" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="210" y="414" font-size="22">&#128293;</text>
  <text x="240" y="413" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Isinma / Jenerator</text>
  <text x="240" y="430" font-family="sans-serif" font-size="10" fill="#64748B">Tüp, Battaniye</text>

