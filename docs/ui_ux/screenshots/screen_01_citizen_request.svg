  <!-- Card 1: Su (Selected) -->
  <rect x="16" y="214" width="164" height="74" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="32" y="246" font-size="22">&#128167;</text>
  <text x="62" y="245" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E40AF">Icme Suyu</text>
  <text x="62" y="262" font-family="sans-serif" font-size="10" fill="#3B82F6">Koli / Damacana</text>
  <circle cx="164" cy="230" r="8" fill="#2563EB"/>
  <text x="164" y="234" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFF" text-anchor="middle">&#10003;</text>

  <!-- Card 2: Cadir (Selected) -->
  <rect x="195" y="214" width="164" height="74" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="210" y="246" font-size="22">&#9978;</text>
  <text x="240" y="245" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E40AF">Kislik Cadir</text>
  <text x="240" y="262" font-family="sans-serif" font-size="10" fill="#3B82F6">Termal / Afet</text>
  <circle cx="343" cy="230" r="8" fill="#2563EB"/>
  <text x="343" y="234" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFF" text-anchor="middle">&#10003;</text>

