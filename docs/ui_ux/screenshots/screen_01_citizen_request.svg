<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="375" height="812" fill="url(#bg)"/>
  
  <!-- iOS Status Bar -->
  <rect width="375" height="44" fill="#DC2626"/>
  <text x="32" y="28" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">09:41</text>
  <circle cx="330" cy="24" r="3" fill="#FFFFFF"/>
  <rect x="338" y="19" width="20" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="340" y="21" width="14" height="6" rx="1.5" fill="#FFFFFF"/>

  <!-- Top Emergency Header -->
  <rect y="44" width="375" height="60" fill="#DC2626"/>
  <text x="20" y="72" font-family="sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">AFLOS</text>
  <text x="20" y="90" font-family="sans-serif" font-size="11" font-weight="500" fill="#FEE2E2">Acil Afet Yardim &amp; Talep Sistemi</text>
  <rect x="295" y="60" width="60" height="26" rx="13" fill="#991B1B"/>
  <text x="325" y="77" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">TR / EN</text>

