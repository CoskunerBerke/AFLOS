<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Arka Plan -->
  <rect width="1440" height="900" fill="#F8FAFC"/>

  <!-- Üst Kurumsal Header (Web Platform) -->
  <rect width="1440" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Logo & Başlık -->
  <rect x="32" y="19" width="32" height="32" rx="6" fill="#B91C1C"/>
  <path d="M 40 37 L 48 27 L 56 37 Z" fill="#FFFFFF"/>
  <text x="76" y="38" class="font" font-size="20" font-weight="900" fill="#0F172A" letter-spacing="-0.5">AFLOS</text>
  <text x="76" y="51" class="font" font-size="11" font-weight="600" fill="#64748B">Afet Lojistik ve İhtiyaç Koordinasyon Platformu</text>

  <!-- Navigasyon Menüsü -->
  <text x="440" y="42" class="font" font-size="14" font-weight="700" fill="#B91C1C">Canlı Afet Haritası</text>
  <line x1="440" y1="68" x2="560" y2="68" stroke="#B91C1C" stroke-width="2.5"/>
  <text x="590" y="42" class="font" font-size="14" font-weight="500" fill="#475569">İhtiyaç Talebi Bildir</text>
  <text x="740" y="42" class="font" font-size="14" font-weight="500" fill="#475569">Talep Sorgula &amp; Takip</text>
  <text x="910" y="42" class="font" font-size="14" font-weight="500" fill="#475569">Saha Gönüllüsü Ol</text>
  <text x="1060" y="42" class="font" font-size="14" font-weight="500" fill="#475569">Taşıyıcı / Tır Sevk</text>

  <!-- Sağ Aksiyon Butonları -->
  <rect x="1220" y="19" width="80" height="34" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1260" y="41" class="font" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Giriş Yap</text>

  <rect x="1312" y="19" width="96" height="34" rx="6" fill="#0F172A"/>
  <text x="1360" y="41" class="font" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Kayıt Ol</text>

  <!-- Ulusal Acil Durum Bilgilendirme Bandı -->
  <rect y="70" width="1440" height="36" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <circle cx="48" cy="88" r="4.5" fill="#B91C1C"/>
  <text x="64" y="92" class="font" font-size="12" font-weight="700" fill="#991B1B">RESMİ AFET MÜDAHALE PROTOKOLÜ:</text>
  <text x="310" y="92" class="font" font-size="12" fill="#7F1D1D">Hatay, Kahramanmaraş ve Adıyaman lojistik koridorları için tır zaman dilimi (slot) randevuları açıktır. İnternetsiz bölgeler için SMS entegrasyonu aktiftir.</text>
  <text x="1408" y="92" class="font" font-size="12" font-weight="600" fill="#991B1B" text-anchor="end">Sistem Durumu: Çevrimiçi · 12 ms</text>

  <!-- KPI Metrikleri Şeridi -->
  <rect x="32" y="122" width="326" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="52" y="148" class="font" font-size="11" font-weight="600" fill="#64748B">TOPLAM BİLDİRİLEN İHTİYAÇ</text>
  <text x="52" y="180" class="mono" font-size="24" font-weight="800" fill="#0F172A">48,210</text>
  <text x="338" y="180" class="font" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="end">Doğrulandı</text>

  <rect x="378" y="122" width="326" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="398" y="148" class="font" font-size="11" font-weight="600" fill="#64748B">İHTİYAÇ KARŞILANMA ORANI</text>
  <text x="398" y="180" class="mono" font-size="24" font-weight="800" fill="#15803D">%76.4</text>
  <text x="684" y="180" class="font" font-size="12" font-weight="600" fill="#15803D" text-anchor="end">36,832 Teslimat</text>

  <rect x="724" y="122" width="326" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="744" y="148" class="font" font-size="11" font-weight="600" fill="#64748B">SAHADAKİ AKTİF LOJİSTİK TIR</text>
  <text x="744" y="180" class="mono" font-size="24" font-weight="800" fill="#0369A1">142 Araç</text>
  <text x="1030" y="180" class="font" font-size="12" font-weight="600" fill="#0369A1" text-anchor="end">Yolda / Sevk Halinde</text>

  <rect x="1070" y="122" width="338" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1090" y="148" class="font" font-size="11" font-weight="600" fill="#64748B">AKREDİTE SAHA GÖNÜLLÜSÜ</text>
  <text x="1090" y="180" class="mono" font-size="24" font-weight="800" fill="#475569">1,280 Kişi</text>
  <text x="1388" y="180" class="font" font-size="12" font-weight="600" fill="#475569" text-anchor="end">18 Depo &amp; Dağıtım</text>

  <!-- SOL TARAF: İNTERAKTİF TÜRKİYE AFET HARİTASI (Web Geniş Ekran) -->
  <rect x="32" y="212" width="870" height="664" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Harita Kontrol Üst Barı -->
  <rect x="32" y="212" width="870" height="48" rx="10 10 0 0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="52" y="242" class="font" font-size="13" font-weight="700" fill="#0F172A">Ulusal Afet ve Lojistik Yoğunluk Haritası (OpenStreetMap &amp; Leaflet Katmanı)</text>
  
  <!-- Filtre Butonları -->
  <rect x="620" y="222" width="70" height="28" rx="4" fill="#0F172A"/>
  <text x="655" y="240" class="font" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">Tümü</text>
  <rect x="696" y="222" width="94" height="28" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="743" y="240" class="font" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Deprem Bölgesi</text>
  <rect x="796" y="222" width="90" height="28" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="841" y="240" class="font" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Kritik Açıklar</text>

  <!-- Harita Tuvali (Açık Gri Vektörel Harita) -->
  <rect x="48" y="272" width="838" height="588" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Şematik Türkiye Yolları ve Koridorları -->
  <!-- Ana Otoyollar -->
  <path d="M 120 480 Q 280 430 460 410 T 680 450 T 800 520" fill="none" stroke="#E2E8F0" stroke-width="6"/>
  <path d="M 240 320 L 460 410 L 580 490 L 680 540" fill="none" stroke="#CBD5E1" stroke-width="4"/>
  <!-- Aktif Güvenli Yardım Koridoru (Ankara - Mersin - Hatay) -->
  <path d="M 380 340 L 460 410 L 520 490 L 560 550" fill="none" stroke="#0F172A" stroke-width="3"/>

  <!-- Lojistik Merkezleri ve Pinler -->
  <!-- 1. Ankara Ana İkmal Deposu -->
  <circle cx="380" cy="340" r="8" fill="#0F172A"/>
  <circle cx="380" cy="340" r="14" fill="none" stroke="#0F172A" stroke-width="1.5" opacity="0.3"/>
  <text x="380" y="325" class="font" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Ankara İkmal Deposu</text>
  <text x="380" y="362" class="font" font-size="10" fill="#64748B" text-anchor="middle">Stok: 24,000 Palet</text>

  <!-- 2. Mersin Lojistik Transfer Limanı -->
  <circle cx="520" cy="490" r="8" fill="#0F172A"/>
  <text x="470" y="494" class="font" font-size="11" font-weight="700" fill="#0F172A" text-anchor="end">Mersin Liman Hub</text>
  <text x="470" y="508" class="font" font-size="10" fill="#64748B" text-anchor="end">42 Tır Beklemede</text>

  <!-- 3. Hatay Antakya (Kritik Afet Bölgesi) -->
  <circle cx="560" cy="550" r="12" fill="#B91C1C"/>
  <circle cx="560" cy="550" r="22" fill="none" stroke="#B91C1C" stroke-width="2" opacity="0.4"/>
  <text x="590" y="546" class="font" font-size="13" font-weight="800" fill="#B91C1C">Hatay · Antakya</text>
  <text x="590" y="562" class="font" font-size="11" font-weight="600" fill="#0F172A">Kritik İhtiyaç: Su, Çadır, Mama</text>
  <text x="590" y="576" class="font" font-size="10" fill="#64748B">3,420 Açık Talep · 18 Tır Yolda</text>

  <!-- 4. Kahramanmaraş (Orta Seviye Bölge) -->
  <circle cx="620" cy="480" r="9" fill="#D97706"/>
  <circle cx="620" cy="480" r="16" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.4"/>
  <text x="640" y="478" class="font" font-size="12" font-weight="700" fill="#D97706">Kahramanmaraş</text>
  <text x="640" y="494" class="font" font-size="10" fill="#64748B">Karşılanma: %68 · İntikalde</text>

  <!-- 5. Gaziantep (Karşılanan Bölge) -->
  <circle cx="680" cy="510" r="8" fill="#15803D"/>
  <text x="700" y="508" class="font" font-size="12" font-weight="700" fill="#15803D">Gaziantep</text>
  <text x="700" y="522" class="font" font-size="10" fill="#64748B">Karşılanma: %89 · Güvenli</text>

  <!-- Yoldaki Tırlar (Hareket İkonları) -->
  <!-- Tır 1 -->
  <rect x="480" y="440" width="36" height="18" rx="3" fill="#0F172A"/>
  <text x="498" y="453" class="mono" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">31 KAA</text>

  <!-- Tır 2 -->
  <rect x="535" y="515" width="36" height="18" rx="3" fill="#B91C1C"/>
  <text x="553" y="528" class="mono" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">34 TİR</text>

  <!-- Harita Lejantı -->
  <rect x="64" y="780" width="340" height="60" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" opacity="0.95"/>
  <circle cx="84" cy="800" r="5" fill="#B91C1C"/>
  <text x="96" y="804" class="font" font-size="11" font-weight="600" fill="#0F172A">Kritik Açık (&lt; %40 Karşılanma)</text>
  <circle cx="84" cy="824" r="5" fill="#D97706"/>
  <text x="96" y="828" class="font" font-size="11" font-weight="600" fill="#0F172A">Sevkiyatta (%40 - %80)</text>
  <circle cx="240" cy="800" r="5" fill="#15803D"/>
  <text x="252" y="804" class="font" font-size="11" font-weight="600" fill="#0F172A">Stabil (&gt; %80 Karşılanma)</text>
  <rect x="238" y="818" width="12" height="10" rx="2" fill="#0F172A"/>
  <text x="256" y="828" class="font" font-size="11" font-weight="600" fill="#0F172A">Hareket Halindeki Tır</text>


  <!-- SAĞ TARAF: PLATFORM HIZLI İŞLEM & TALEP PANELİ (Web 480px) -->
  <rect x="922" y="212" width="486" height="664" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Sekmeler -->
  <rect x="922" y="212" width="486" height="52" rx="10 10 0 0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="934" y="222" width="150" height="34" rx="6" fill="#0F172A"/>
  <text x="1009" y="244" class="font" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">İhtiyaç Bildir</text>
  <rect x="1092" y="222" width="150" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1167" y="244" class="font" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Talep Durumu Takip</text>
  <rect x="1250" y="222" width="146" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1323" y="244" class="font" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Gönüllü / Taşıyıcı</text>

  <!-- Panel İçeriği: Vatandaş İçin Web İhtiyaç Formu -->
  <text x="946" y="292" class="font" font-size="16" font-weight="800" fill="#0F172A">Afet İhtiyaç Bildirim Formu</text>
  <text x="946" y="310" class="font" font-size="12" fill="#64748B">Hesap açmanız gerekmez. Bildiriminiz doğrudan kriz masası triyajına iletilir.</text>

  <!-- Lokasyon Seçimi (Web Grid) -->
  <text x="946" y="338" class="font" font-size="11" font-weight="700" fill="#475569">AFET İLİ / İLÇESİ</text>
  <rect x="946" y="346" width="210" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="958" y="370" class="font" font-size="13" font-weight="600" fill="#0F172A">Hatay · Antakya</text>
  
  <text x="1170" y="338" class="font" font-size="11" font-weight="700" fill="#475569">MAHALLE / CADDE / ÇADIR KENT</text>
  <rect x="1170" y="346" width="216" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1182" y="370" class="font" font-size="13" font-weight="500" fill="#0F172A">Odabaşı Mah. 4. Çadır Alanı</text>

  <!-- İhtiyaç Malzemeleri Çoklu Seçim (Web Kartları) -->
  <text x="946" y="412" class="font" font-size="11" font-weight="700" fill="#475569">GEREKEN ACİL İHTİYAÇLAR (Çoklu Seçim)</text>
  
  <!-- Seçim 1: Su -->
  <rect x="946" y="422" width="138" height="52" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5"/>
  <text x="958" y="442" class="font" font-size="12" font-weight="700" fill="#0F172A">İçme Suyu</text>
  <text x="958" y="458" class="font" font-size="10" fill="#64748B">Koli / Damacana</text>
  <circle cx="1066" cy="434" r="5" fill="#0F172A"/>

  <!-- Seçim 2: Çadır -->
  <rect x="1092" y="422" width="138" height="52" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5"/>
  <text x="1104" y="442" class="font" font-size="12" font-weight="700" fill="#0F172A">Kışlık Çadır</text>
  <text x="1104" y="458" class="font" font-size="10" fill="#64748B">Isı Yalıtımlı</text>
  <circle cx="1212" cy="434" r="5" fill="#0F172A"/>

  <!-- Seçim 3: Bebek & Hijyen -->
  <rect x="1238" y="422" width="148" height="52" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5"/>
  <text x="1250" y="442" class="font" font-size="12" font-weight="700" fill="#0F172A">Bebek &amp; Mama</text>
  <text x="1250" y="458" class="font" font-size="10" fill="#64748B">Bez, Islak Mendil</text>
  <circle cx="1368" cy="434" r="5" fill="#0F172A"/>

  <!-- Kişi & Kırılgan Grup Triyajı (Web Sütunları) -->
  <text x="946" y="500" class="font" font-size="11" font-weight="700" fill="#475569">KİŞİ VE KIRILGAN GRUP SAYISI (Öncelikli Sevk İçin)</text>
  <rect x="946" y="510" width="440" height="66" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  
  <text x="964" y="534" class="font" font-size="11" font-weight="700" fill="#0F172A">Bebek (0-2)</text>
  <rect x="964" y="542" width="60" height="22" rx="4" fill="#0F172A"/>
  <text x="994" y="557" class="font" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">1 Bebek</text>

  <text x="1074" y="534" class="font" font-size="11" font-weight="600" fill="#475569">Çocuk (3-12)</text>
  <rect x="1074" y="542" width="60" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1104" y="557" class="font" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">+ Ekle</text>

  <text x="1184" y="534" class="font" font-size="11" font-weight="700" fill="#0F172A">Yaşlı (65+)</text>
  <rect x="1184" y="542" width="60" height="22" rx="4" fill="#0F172A"/>
  <text x="1214" y="557" class="font" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">1 Yaşlı</text>

  <text x="1294" y="534" class="font" font-size="11" font-weight="700" fill="#0F172A">Yetişkin</text>
  <rect x="1294" y="542" width="70" height="22" rx="4" fill="#0F172A"/>
  <text x="1329" y="557" class="font" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">2 Yetişkin</text>

  <!-- İletişim & SMS Alanı -->
  <text x="946" y="602" class="font" font-size="11" font-weight="700" fill="#475569">BİLDİRİM YAPAN KİŞİ VE TELEFON (Takip Kodu SMS ile Gönderilir)</text>
  <rect x="946" y="610" width="210" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="958" y="634" class="font" font-size="13" font-weight="600" fill="#0F172A">Ahmet Kılınç</text>

  <rect x="1170" y="610" width="216" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1182" y="634" class="mono" font-size="13" font-weight="600" fill="#0F172A">+90 532 984 47 00</text>

  <!-- Aciliyet & Triyaj Durumu -->
  <rect x="946" y="662" width="440" height="42" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <circle cx="964" cy="683" r="4" fill="#B91C1C"/>
  <text x="978" y="681" class="font" font-size="11" font-weight="700" fill="#991B1B">Yüksek Öncelikli Triyaj (P1 Acil Sevk):</text>
  <text x="978" y="695" class="font" font-size="10" fill="#7F1D1D">Bebek ve donma riski taşıyan yaşlı vatandaş mevcuttur. Tır tahsisi öne alınacaktır.</text>

  <!-- Gönder Butonu -->
  <rect x="946" y="720" width="440" height="48" rx="8" fill="#B91C1C"/>
  <text x="1166" y="750" class="font" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">İhtiyaç Bildirimini Sisteme Gönder</text>

  <!-- SMS Yedek Hat Uyarısı -->
  <text x="1166" y="790" class="font" font-size="11" fill="#64748B" text-anchor="middle">İnternet kesintisi durumunda aynı talebi <tspan font-weight="700" fill="#0F172A">SMS ile (2G)</tspan> iletebilirsiniz: AFLOS CADIR 4 HATAY ODABASI</text>

  <!-- Platform İkincil Eylemleri (Gönüllü & Taşıyıcı Kartı) -->
  <rect x="946" y="812" width="214" height="48" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="958" y="832" class="font" font-size="12" font-weight="700" fill="#0F172A">Saha Gönüllüsü Ol</text>
  <text x="958" y="848" class="font" font-size="10" fill="#64748B">Depo &amp; Dağıtım Ekipleri</text>

  <rect x="1172" y="812" width="214" height="48" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1184" y="832" class="font" font-size="12" font-weight="700" fill="#0F172A">Lojistik Tırını Kaydet</text>
  <text x="1184" y="848" class="font" font-size="10" fill="#64748B">Zaman Dilimli Sevk Randevusu</text>
</svg>
