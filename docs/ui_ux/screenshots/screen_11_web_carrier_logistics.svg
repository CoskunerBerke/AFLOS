<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F8FAFC"/>

  <!-- Üst Menü Çubuğu (Lojistik Platform) -->
  <rect width="1440" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="32" y="19" width="32" height="32" rx="6" fill="#0F172A"/>
  <path d="M 40 37 L 48 27 L 56 37 Z" fill="#FFFFFF"/>
  <text x="76" y="38" class="font" font-size="20" font-weight="900" fill="#0F172A" letter-spacing="-0.5">AFLOS</text>
  <text x="76" y="51" class="font" font-size="11" font-weight="600" fill="#64748B">Taşıyıcı ve Filo Lojistik Sevk Portalı</text>

  <!-- Lojistik Navigasyon -->
  <text x="420" y="42" class="font" font-size="14" font-weight="700" fill="#0F172A">Açık Sevk Havuzu</text>
  <line x1="420" y1="68" x2="540" y2="68" stroke="#0F172A" stroke-width="2.5"/>
  <text x="570" y="42" class="font" font-size="14" font-weight="500" fill="#475569">Slot Rezervasyonu</text>
  <text x="790" y="42" class="font" font-size="14" font-weight="500" fill="#475569">Sefer &amp; Manifesto</text>
  <text x="1050" y="42" class="font" font-size="14" font-weight="500" fill="#475569">Boş Araç Bildir</text>

  <!-- Profil Bilgisi -->
  <rect x="1230" y="18" width="178" height="36" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
