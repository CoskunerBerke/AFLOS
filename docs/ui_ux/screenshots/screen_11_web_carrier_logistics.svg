  <text x="64" y="92" class="font" font-size="12" font-weight="700" fill="#1E3A8A">LOJİSTİK TRAFİK KONTROLÜ:</text>
  <text x="248" y="92" class="font" font-size="12" fill="#1D4ED8">Antakya girişinde saatlik 8 tır kotası vardır. Randevusuz araç alınmaz.</text>

