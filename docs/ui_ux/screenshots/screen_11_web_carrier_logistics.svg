  <rect x="32" y="122" width="870" height="754" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <rect x="32" y="122" width="870" height="54" rx="10 10 0 0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="52" y="154" class="font" font-size="15" font-weight="800" fill="#0F172A">Afet Bölgeleri &amp; İntikal Slotları</text>
  
