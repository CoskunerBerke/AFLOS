  <text x="946" y="348" class="font" font-size="11" font-weight="700" fill="#475569">ŞOFÖR T.C. VE TELEFON NUMARASI</text>
  <rect x="946" y="356" width="210" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="958" y="380" class="mono" font-size="13" font-weight="600" fill="#0F172A">230204•••••</text>

  <rect x="1170" y="356" width="214" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1182" y="380" class="mono" font-size="13" font-weight="600" fill="#0F172A">+90 532 984 47 00</text>

  <!-- Yük Manifestosu Detayı (Çoklu Palet) -->
  <text x="946" y="416" class="font" font-size="11" font-weight="700" fill="#475569">TAŞINACAK YARDIM MALZEMESİ (MANİFESTO)</text>
  
  <rect x="946" y="424" width="438" height="96" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  
  <text x="962" y="448" class="font" font-size="12" font-weight="700" fill="#0F172A">• İçme Suyu (0.5L Şişe)</text>
  <text x="1368" y="448" class="font" font-size="12" font-weight="700" fill="#0F172A" text-anchor="end">18 Palet (12,960 Koli)</text>

  <text x="962" y="474" class="font" font-size="12" font-weight="700" fill="#0F172A">• Bebek Maması &amp; Hijyen</text>
  <text x="1368" y="474" class="font" font-size="12" font-weight="700" fill="#0F172A" text-anchor="end">4 Palet (480 Koli)</text>

  <text x="962" y="500" class="font" font-size="12" font-weight="700" fill="#0F172A">• Kışlık Termal Battaniye</text>
  <text x="1368" y="500" class="font" font-size="12" font-weight="700" fill="#0F172A" text-anchor="end">2 Palet (300 Adet)</text>

  <!-- Yükleme Deposu -->
  <text x="946" y="542" class="font" font-size="11" font-weight="700" fill="#475569">ÇIKIŞ NOKTASI / YÜKLEME DEPOSU</text>
  <rect x="946" y="550" width="438" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="958" y="574" class="font" font-size="13" font-weight="600" fill="#0F172A">Mersin Liman Depo 4</text>

