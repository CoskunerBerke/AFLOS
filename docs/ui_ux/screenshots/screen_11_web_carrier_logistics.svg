  <circle cx="964" cy="628" r="4" fill="#B91C1C"/>
  <text x="978" y="622" class="font" font-size="11" font-weight="700" fill="#991B1B">Çevrimdışı Teslimat Doğrulama Güvencesi:</text>
  <text x="978" y="638" class="font" font-size="10" fill="#7F1D1D">İnternetsiz QR okutma ile boşaltma onaylanır.</text>

  <!-- Onay Butonu -->
  <rect x="946" y="670" width="438" height="50" rx="8" fill="#0F172A"/>
