  <text x="1248" y="40" class="font" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">TR</text>
  <text x="1266" y="34" class="font" font-size="12" font-weight="700" fill="#0F172A">Mehmet K. (Şoför)</text>
  <text x="1266" y="47" class="font" font-size="10" fill="#64748B">Plaka: 31 KAA 84 · Onaylı</text>

