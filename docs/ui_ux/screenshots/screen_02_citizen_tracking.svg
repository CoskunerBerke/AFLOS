<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <defs>
    <filter id="sh" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="375" height="812" fill="#F8FAFC"/>
  
  <!-- Status Bar -->
  <rect width="375" height="44" fill="#0F172A"/>
  <text x="32" y="28" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFF">09:44</text>
  
  <!-- Header -->
  <rect y="44" width="375" height="56" fill="#0F172A"/>
  <text x="24" y="78" font-size="18" fill="#FFF">&#8592;</text>
  <text x="56" y="78" font-family="sans-serif" font-size="17" font-weight="700" fill="#FFF">Talep Takip Paneli</text>

  <!-- Big Code Card -->
  <rect x="16" y="116" width="343" height="112" rx="14" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="32" y="142" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748B">TAKIP KODUNUZ</text>
  <text x="32" y="178" font-family="monospace" font-size="32" font-weight="900" fill="#0F172A" letter-spacing="2">TRK-8492X</text>
  <rect x="236" y="130" width="107" height="28" rx="14" fill="#FEF3C7"/>
  <circle cx="248" cy="144" r="4" fill="#D97706"/>
  <text x="296" y="148" font-family="sans-serif" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">YOLDA / SEVK</text>
  <text x="32" y="212" font-family="sans-serif" font-size="11" fill="#64748B">Talebiniz Antakya Sahra Depo 2 birimince sevk edildi.</text>

  <!-- Stepper Card -->
  <rect x="16" y="240" width="343" height="236" rx="14" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="32" y="268" font-family="sans-serif" font-size="14" font-weight="800" fill="#0F172A">Canli Sevk Asamalari</text>

  <!-- Step 1 -->
  <circle cx="44" cy="300" r="10" fill="#16A34A"/>
  <text x="44" y="304" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">&#10003;</text>
  <line x1="44" y1="310" x2="44" y2="340" stroke="#16A34A" stroke-width="2"/>
  <text x="68" y="299" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Talep Alindi</text>
  <text x="68" y="313" font-family="sans-serif" font-size="11" fill="#64748B">09:41 - GPS Koordinatlari dogrulandi</text>

  <!-- Step 2 -->
  <circle cx="44" cy="350" r="10" fill="#16A34A"/>
  <text x="44" y="354" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">&#10003;</text>
  <line x1="44" y1="360" x2="44" y2="390" stroke="#16A34A" stroke-width="2"/>
  <text x="68" y="349" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Triyaj Onayi Verildi</text>
  <text x="68" y="363" font-family="sans-serif" font-size="11" fill="#16A34A">Oncelik Skoru: 8.7/10 (Yuksek Aciliyet)</text>

  <!-- Step 3 (Active) -->
  <circle cx="44" cy="400" r="10" fill="#2563EB"/>
  <circle cx="44" cy="400" r="14" fill="#2563EB" opacity="0.2"/>
  <line x1="44" y1="410" x2="44" y2="440" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="68" y="399" font-family="sans-serif" font-size="13" font-weight="700" fill="#2563EB">Araca Yuklendi ve Sevk Edildi</text>
  <text x="68" y="413" font-family="sans-serif" font-size="11" fill="#64748B">Tir Plaka: 31-K-4920 (Tahmini: 25 dk)</text>

  <!-- Step 4 -->
  <circle cx="44" cy="450" r="10" fill="#E2E8F0"/>
  <text x="68" y="449" font-family="sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Teslimat ve QR Onayi</text>
  <text x="68" y="463" font-family="sans-serif" font-size="11" fill="#94A3B8">Noktada temassiz QR okutulacak</text>

  <!-- Courier Card -->
  <rect x="16" y="490" width="343" height="96" rx="14" fill="#FFFFFF" filter="url(#sh)"/>
  <circle cx="52" cy="538" r="22" fill="#E2E8F0"/>
  <text x="52" y="544" font-size="20" text-anchor="middle">&#128666;</text>
  <text x="86" y="528" font-family="sans-serif" font-size="14" font-weight="800" fill="#0F172A">Mehmet Y. (Gönüllü Nakliye)</text>
  <text x="86" y="546" font-family="sans-serif" font-size="12" fill="#64748B">Arac: Isuzu Kamyonet | 31-K-4920</text>
  <text x="86" y="564" font-family="sans-serif" font-size="12" font-weight="600" fill="#2563EB">Yuk: 40 Koli Su, 2 Kislik Cadir</text>

  <!-- SMS Fallback Card -->
  <rect x="16" y="598" width="343" height="74" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="32" y="622" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F172A">&#128246; Sebeke Kesintisi Durumunda:</text>
  <text x="32" y="640" font-family="sans-serif" font-size="11" fill="#475569">Internetiniz kesilirse <tspan font-weight="bold">DURUM TRK-8492X</tspan> yazip</text>
  <text x="32" y="656" font-family="sans-serif" font-size="11" fill="#475569"><tspan font-weight="bold">3820</tspan> ucretsiz SMS numarasina iletebilirsiniz.</text>

  <!-- Cancel Request Button -->
  <rect x="16" y="688" width="343" height="46" rx="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
  <text x="187" y="717" font-family="sans-serif" font-size="13" font-weight="700" fill="#DC2626" text-anchor="middle">Yardima Ihtiyacim Kalmadi (Iptal Et)</text>
</svg>