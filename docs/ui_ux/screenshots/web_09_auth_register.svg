<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="1440" height="900" fill="#F8FAFC"/>

  <!-- Üst Menü Çubuğu (Web Platform) -->
  <rect width="1440" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="32" y="19" width="32" height="32" rx="6" fill="#B91C1C"/>
  <path d="M 40 37 L 48 27 L 56 37 Z" fill="#FFFFFF"/>
  <text x="76" y="38" class="font" font-size="20" font-weight="900" fill="#0F172A" letter-spacing="-0.5">AFLOS</text>
  <text x="76" y="51" class="font" font-size="11" font-weight="600" fill="#64748B">Afet Lojistik ve İhtiyaç Koordinasyon Platformu</text>

  <!-- Navigasyon Menüsü -->
  <text x="440" y="42" class="font" font-size="14" font-weight="500" fill="#475569">Canlı Afet Haritası</text>
  <text x="610" y="42" class="font" font-size="14" font-weight="500" fill="#475569">İhtiyaç Talebi Bildir</text>
  <text x="780" y="42" class="font" font-size="14" font-weight="500" fill="#475569">Talep Sorgula &amp; Takip</text>
  <text x="960" y="42" class="font" font-size="14" font-weight="500" fill="#475569">Saha Gönüllüsü Ol</text>
  <text x="1120" y="42" class="font" font-size="14" font-weight="500" fill="#475569">Taşıyıcı / Tır Sevk</text>

  <!-- Sağ Butonlar -->
  <rect x="1260" y="18" width="90" height="34" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1305" y="40" class="font" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Giriş Yap</text>

  <rect x="1358" y="18" width="90" height="34" rx="6" fill="#0F172A"/>
  <text x="1403" y="40" class="font" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Kayıt Ol</text>

  <!-- Bilgi Şeridi -->
  <rect y="70" width="1440" height="36" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <circle cx="48" cy="88" r="4.5" fill="#16A34A"/>
  <text x="64" y="92" class="font" font-size="12" font-weight="700" fill="#166534">RESMİ AKREDİTASYON VE SAHA KAYIT PORTALI:</text>
  <text x="350" y="92" class="font" font-size="12" fill="#15803D">Afet bölgesine izinsiz ve koordinasyonsuz girişleri engellemek için tüm kullanıcılar T.C. İçişleri Bakanlığı NVİ doğrulaması ile kaydedilir.</text>
  <text x="1408" y="92" class="font" font-size="12" font-weight="600" fill="#166534" text-anchor="end">Doğrulama: NVİ MERNİS</text>

  <!-- Ana Kayıt Kartı (1180x730) -->
  <g filter="url(#card-shadow)">
    <rect x="130" y="126" width="1180" height="740" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Kart Üst Başlık -->
    <rect x="130" y="126" width="1180" height="66" rx="12 12 0 0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="166" y="156" class="font" font-size="18" font-weight="800" fill="#0F172A">AFLOS Resmi Hesap Oluşturma &amp; Akreditasyon Portalı</text>
    <text x="166" y="176" class="font" font-size="12" fill="#64748B">Saha lojistiğinde görev almak, tır filonuzu sisteme entegre etmek veya depo sayımında yer almak için kaydolun.</text>
    <rect x="1140" y="142" width="140" height="32" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <text x="1210" y="162" class="font" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">✓ NVİ Güvenli Doğrulama</text>

    <!-- Adım 1: Kayıt / Rol Türü Seçimi -->
    <text x="166" y="222" class="font" font-size="11" font-weight="700" fill="#475569">1. ADIM: HESAP TÜRÜ VE GÖREV ALANINIZI SEÇİN</text>
    
    <!-- Kart 1: Gönüllü (Seçili) -->
    <rect x="166" y="234" width="360" height="68" rx="8" fill="#0F172A"/>
    <circle cx="196" cy="268" r="14" fill="#B91C1C"/>
    <text x="196" y="272" class="font" font-size="12" font-weight="900" fill="#FFF" text-anchor="middle">G</text>
    <text x="222" y="260" class="font" font-size="13" font-weight="800" fill="#FFFFFF">Bireysel Saha Gönüllüsü</text>
    <text x="222" y="278" class="font" font-size="11" fill="#94A3B8">Depo tasnif, çadır kent dağıtım, sayım ve ilk yardım</text>
    <circle cx="504" cy="256" r="6" fill="#16A34A"/>
    <text x="504" y="260" class="font" font-size="9" font-weight="900" fill="#FFF" text-anchor="middle">✓</text>

    <!-- Kart 2: Taşıyıcı -->
    <rect x="540" y="234" width="360" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="570" cy="268" r="14" fill="#E2E8F0"/>
    <text x="570" y="272" class="font" font-size="12" font-weight="900" fill="#334155" text-anchor="middle">T</text>
    <text x="596" y="260" class="font" font-size="13" font-weight="700" fill="#0F172A">Lojistik Taşıyıcı / Tır Sahibi</text>
    <text x="596" y="278" class="font" font-size="11" fill="#64748B">Özmal veya ticari araçla yardım malzemesi nakliyesi</text>

    <!-- Kart 3: Kurumsal STK -->
    <rect x="914" y="234" width="360" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="944" cy="268" r="14" fill="#E2E8F0"/>
    <text x="944" y="272" class="font" font-size="12" font-weight="900" fill="#334155" text-anchor="middle">K</text>
    <text x="970" y="260" class="font" font-size="13" font-weight="700" fill="#0F172A">Kurumsal STK &amp; Kamu Temsilcisi</text>
    <text x="970" y="278" class="font" font-size="11" fill="#64748B">Kızılay, AKUT, Ahbap, İHH ve yerel yönetim yetkilisi</text>

    <!-- Adım 2: Form Bilgileri Grid (İki Sütun: Sol 520px, Sağ 520px) -->
    <text x="166" y="336" class="font" font-size="11" font-weight="700" fill="#475569">2. ADIM: KİMLİK VE İLETİŞİM BİLGİLERİ (NVİ MERNİS DOĞRULAMALI)</text>

    <!-- Sol Sütun -->
    <!-- T.C. Kimlik -->
    <text x="166" y="360" class="font" font-size="11" font-weight="700" fill="#475569">T.C. KİMLİK NUMARASI</text>
    <rect x="166" y="370" width="530" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="182" y="396" class="mono" font-size="14" font-weight="700" fill="#0F172A">23020404782</text>
    <rect x="600" y="376" width="86" height="30" rx="4" fill="#DCFCE7"/>
    <text x="643" y="395" class="font" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">✓ Doğrulandı</text>

    <!-- Ad Soyad -->
    <text x="166" y="434" class="font" font-size="11" font-weight="700" fill="#475569">AD SOYAD</text>
    <rect x="166" y="444" width="530" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="182" y="470" class="font" font-size="14" font-weight="600" fill="#0F172A">Kaan Kılınç</text>

    <!-- Telefon -->
    <text x="166" y="508" class="font" font-size="11" font-weight="700" fill="#475569">GSM TELEFON (SMS Doğrulama Kodu Gönderilir)</text>
    <rect x="166" y="518" width="530" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="182" y="544" class="mono" font-size="14" font-weight="600" fill="#0F172A">+90 532 984 47 00</text>

    <!-- E-posta -->
    <text x="166" y="582" class="font" font-size="11" font-weight="700" fill="#475569">E-POSTA ADRESİ</text>
    <rect x="166" y="592" width="530" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="182" y="618" class="font" font-size="14" font-weight="600" fill="#0F172A">kaan.kilinc@afad.gov.tr</text>

    <!-- Sağ Sütun -->
    <!-- Şifre Belirleme -->
    <text x="744" y="360" class="font" font-size="11" font-weight="700" fill="#475569">HESAP ŞİFRESİ (En az 8 karakter, harf ve rakam)</text>
    <rect x="744" y="370" width="530" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="760" y="396" class="mono" font-size="16" font-weight="700" fill="#0F172A">••••••••••••••••</text>
    <text x="1230" y="394" class="font" font-size="11" font-weight="600" fill="#16A34A">Güçlü</text>

    <!-- İkamet & Tercih Bölgesi -->
    <text x="744" y="434" class="font" font-size="11" font-weight="700" fill="#475569">GÖREV ALINABİLECEK AFET BÖLGESİ / İL</text>
    <rect x="744" y="444" width="530" height="42" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5"/>
    <text x="760" y="470" class="font" font-size="14" font-weight="700" fill="#0F172A">Hatay · Antakya Sahra Lojistik Deposu (Acil İhtiyaç)</text>

    <!-- Yetkinlik ve Ehliyet Çipleri -->
    <text x="744" y="508" class="font" font-size="11" font-weight="700" fill="#475569">YETKİNLİKLER VE BELGELER (Çoklu Seçim)</text>
    <rect x="744" y="518" width="124" height="42" rx="6" fill="#0F172A"/>
    <text x="806" y="543" class="font" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">✓ Forklift / Vinç</text>

    <rect x="876" y="518" width="124" height="42" rx="6" fill="#0F172A"/>
    <text x="938" y="543" class="font" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">✓ İlk Yardım Eğitimi</text>

    <rect x="1008" y="518" width="124" height="42" rx="6" fill="#0F172A"/>
    <text x="1070" y="543" class="font" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">✓ Depo Tasnif</text>

    <rect x="1140" y="518" width="134" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="1207" y="543" class="font" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">+ CE Ağır Vasıta</text>

    <!-- Kan Grubu & Acil Durum Yakını -->
    <text x="744" y="582" class="font" font-size="11" font-weight="700" fill="#475569">KAN GRUBU &amp; ACİL DURUM İRTİBATI (Saha Güvenliği İçin)</text>
    <rect x="744" y="592" width="160" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="760" y="618" class="font" font-size="13" font-weight="700" fill="#B91C1C">0 Rh+ (Pozitif)</text>

    <rect x="914" y="592" width="360" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="930" y="618" class="font" font-size="13" font-weight="600" fill="#0F172A">Mehmet Kılınç (Kardeşi) - 0533 112 33 44</text>

    <!-- KVKK & Onay -->
    <rect x="166" y="654" width="1108" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="180" y="670" width="16" height="16" rx="3" fill="#0F172A"/>
    <text x="188" y="682" class="font" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle">✓</text>
    <text x="206" y="682" class="font" font-size="12" fill="#334155">6698 sayılı KVKK kapsamında afet lojistik operasyonu, görevlendirme ve sahra güvenliği amacıyla kimlik ve iletişim verilerimin işlenmesini, AFAD koordinasyonunda resmi saha görevlisi olarak atanmayı kabul ediyorum.</text>

    <!-- Kayıt Butonu ve Giriş Köprüsü -->
    <rect x="166" y="720" width="760" height="50" rx="8" fill="#B91C1C"/>
    <text x="546" y="751" class="font" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">Resmi Saha Akreditasyon Kaydını Tamamla</text>

    <rect x="946" y="720" width="328" height="50" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="1110" y="751" class="font" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Zaten Hesabım Var: Giriş Yap →</text>

    <!-- SMS Bilgilendirmesi -->
    <text x="720" y="802" class="font" font-size="11" fill="#64748B" text-anchor="middle">Kaydınız onaylandığında <tspan font-weight="700" fill="#0F172A">Karekodlu Dijital Görev Kartınız</tspan> SMS ile cep telefonunuza iletilecektir. Giriş kontrol noktalarında gösterilmelidir.</text>
  </g>
</svg>
