      description: Chronological timestamp,id ordering; from <= to. No update/delete API. Mask secret values;
        operational fallback reasons may be included subject to authorized access.
      tags:
      - Audit
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryList'
              example: &id060
                items: []
                page: 1
                pageSize: 20
                total: 0
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-user-stories:
      - US-10
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: entityId
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signature, expiry and account status validated by server; x-roles describes application
        authorization, not OAuth scopes. Object ownership and live zone/shift grants checked independently.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Draft A-09: unique operation key, scoped by caller (or anonymous session), HTTP method
        and path. Persist atomic successful result 24h. Same key/different payload ->409. Never put personal
        data into the key. Anonymous reporting uses a server-issued session cookie for scope.'
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
      example: aflos-demo-operation-0001
  schemas:
    DisasterType:
      type: string
      enum:
      - EARTHQUAKE
      - FLOOD
      - WILDFIRE
      - CONFLICT_HUMANITARIAN
      - LANDSLIDE_AVALANCHE
    AidCategory:
      type: string
      enum:
      - WATER_BEVERAGE
      - FOOD_NUTRITION
      - SHELTER_WARMING
      - CLOTHING
      - MEDICAL_FIRST_AID
      - HYGIENE
      - EQUIPMENT_TOOLS
    Unit:
      type: string
      enum:
      - CASE
      - PIECE
      - BOX
      - PALLET
      - KG
    VehicleType:
      type: string
      enum:
      - TRUCK_TIR
      - LORRY
      - VAN
      - CAR
    ShipmentStatus:
      type: string
      enum:
      - CONFIRMED
      - IN_TRANSIT
      - DELIVERED
      - CANCELLED
      - NO_SHOW
    Role:
      type: string
      enum:
      - REPORTER
      - CARRIER
      - FIELD_STAFF
      - COORDINATOR
      - ADMIN
    VerificationCode:
      type: string
      pattern: ^AFL-[A-Z0-9]{6}$
      description: 'Draft assumption A-01: AFL- prefix plus six uppercase alphanumeric characters. Secret,
        shipment-bound, single-use; never include in public, field listing or audit responses. Not an independent
        authentication factor.'
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
          maxLength: 100
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 500
              message:
                type: string
                minLength: 1
                maxLength: 500
            required:
            - field
            - message
      required:
      - code
      - message
      - requestId
    Location:
      type: object
      additionalProperties: false
      properties:
        lat:
          type: number
          minimum: 35.9
          maximum: 42.1
        lng:
          type: number
          minimum: 25.6
          maximum: 44.8
      required:
      - lat
      - lng
      description: MVP bounding rectangle from US-01; not a legal or exact national border polygon.
    NeedInput:
      type: object
      additionalProperties: false
      properties:
        category: &id014
          $ref: '#/components/schemas/AidCategory'
        itemName: &id015
          type: string
          minLength: 1
          maxLength: 120
        requiredQuantity: &id016
          type: number
          exclusiveMinimum: 0
          description: Positive finite quantity. KG may be fractional; all other MVP units require whole numbers
            (server validation).
        unit: &id017
          $ref: '#/components/schemas/Unit'
      required:
      - category
      - itemName
      - requiredQuantity
      - unit
      examples:
      - *id013
    Need:
      type: object
      additionalProperties: false
      properties:
        itemId:
          type: string
          minLength: 1
          maxLength: 100
        zoneId:
          type: string
          minLength: 1
          maxLength: 100
        category: *id014
        itemName: *id015
        requiredQuantity: *id016
        unit: *id017
        reservedQuantity:
          type: number
          minimum: 0
        deliveredQuantity:
          type: number
          minimum: 0
        openDeficit:
          type: number
          minimum: 0
        remainingQuantity:
          type: number
          minimum: 0
          description: Compatibility alias of openDeficit; retained for US-04. Never requiredQuantity minus
            delivered alone.
        fulfillmentPercent:
          type: number
          minimum: 0
          maximum: 100
          description: min(100,100*deliveredQuantity/requiredQuantity); never sum different items or units.
      required:
      - itemId
      - zoneId
      - category
      - itemName
      - requiredQuantity
      - unit
      - reservedQuantity
      - deliveredQuantity
      - openDeficit
      - remainingQuantity
      - fulfillmentPercent
      examples:
      - *id003
    ReportItem:
      type: object
      additionalProperties: false
      properties:
        category:
          $ref: '#/components/schemas/AidCategory'
        itemName:
          type: string
          minLength: 1
          maxLength: 120
        quantity:
          type: number
          exclusiveMinimum: 0
          description: Positive finite quantity. KG may be fractional; all other MVP units require whole numbers
            (server validation).
        unit:
          $ref: '#/components/schemas/Unit'
      required:
      - category
      - itemName
      - quantity
      - unit
    NeedRequestInput:
      type: object
      additionalProperties: false
      properties:
        location: &id020
          $ref: '#/components/schemas/Location'
        disasterType: &id021
          $ref: '#/components/schemas/DisasterType'
        contactName: &id022
          type: string
          minLength: 1
          maxLength: 100
        contactPhone: &id023
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          description: International phone format; collected only for coordinator verification.
        items: &id024
          type: array
          items:
            $ref: '#/components/schemas/ReportItem'
          minItems: 1
          maxItems: 50
      required:
      - location
      - disasterType
      - contactPhone
      - items
      examples:
      - *id018
    NeedRequestReceipt:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum:
          - PENDING_VERIFICATION
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
      required:
      - id
      - status
      - createdAt
      examples:
      - *id019
    NeedRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum:
          - PENDING_VERIFICATION
          - VERIFIED
          - REJECTED
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
        location: *id020
        disasterType: *id021
        contactName: *id022
        contactPhone: *id023
        items: *id024
      required:
      - id
      - status
      - createdAt
      - location
      - disasterType
      - contactPhone
      - items
    ReviewNeedRequest:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - VERIFIED
          - REJECTED
        reason:
          type: string
          minLength: 1
          maxLength: 500
        targetZoneId:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - decision
      - reason
      description: 'Draft A-08: VERIFIED links to an existing zone; targetZoneId then mandatory. Verification
        alone does not publish the report or copy needs; use explicit zone/need creation. REJECTED cannot set
        targetZoneId.'
      examples:
      - *id025
    SlotInput:
      type: object
      additionalProperties: false
      properties:
        startsAt: &id026
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
        endsAt: &id027
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
        maxVehicles: &id028
          type: integer
          minimum: 1
        allowedVehicleTypes: &id029
          type: array
          items:
            $ref: '#/components/schemas/VehicleType'
          minItems: 1
          uniqueItems: true
      required:
      - startsAt
      - endsAt
      - maxVehicles
      - allowedVehicleTypes
      description: startsAt < endsAt; future slot, half-open interval [start,end). No overlapping slots within
        one zone in draft A-03.
    Slot:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        zoneId:
          type: string
          minLength: 1
          maxLength: 100
        startsAt: *id026
        endsAt: *id027
        maxVehicles: *id028
        allowedVehicleTypes: *id029
        assignedVehicles:
          type: integer
          minimum: 0
          description: Counts CONFIRMED, IN_TRANSIT and DELIVERED appointments. Delivery does not release this
            count.
        availableVehicles:
          type: integer
          minimum: 0
          description: maxVehicles-assignedVehicles. Availability is advisory until atomic booking commits.
      required:
      - id
      - zoneId
      - startsAt
      - endsAt
      - maxVehicles
      - allowedVehicleTypes
      - assignedVehicles
      - availableVehicles
    ZoneInput:
      type: object
      additionalProperties: false
      properties:
        zoneName:
          type: string
          minLength: 1
          maxLength: 150
        location:
          $ref: '#/components/schemas/Location'
        disasterType:
          $ref: '#/components/schemas/DisasterType'
        timeSlots:
          type: array
          items:
            $ref: '#/components/schemas/SlotInput'
          minItems: 1
          maxItems: 30
      required:
      - zoneName
      - location
      - disasterType
      - timeSlots
      examples:
      - *id030
    Zone:
      type: object
      additionalProperties: false
      properties:
        id: &id031
          type: string
          minLength: 1
          maxLength: 100
        zoneName: &id032
          type: string
        location: &id033
          $ref: '#/components/schemas/Location'
        disasterType: &id034
          $ref: '#/components/schemas/DisasterType'
        status: &id035
          type: string
          enum:
          - ACTIVE
          - DEACTIVATED
      required:
      - id
      - zoneName
      - location
      - disasterType
      - status
    ZoneDetail:
      type: object
      additionalProperties: false
      properties:
        id: *id031
        zoneName: *id032
        location: *id033
        disasterType: *id034
        status: *id035
        needs:
          type: array
          items:
            $ref: '#/components/schemas/Need'
        timeSlots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
      required:
      - id
      - zoneName
      - location
      - disasterType
      - status
      - needs
      - timeSlots
      examples:
      - *id005
    VehicleInput:
      type: object
      additionalProperties: false
      properties:
        licensePlate: &id036
          type: string
          minLength: 5
          maxLength: 15
          description: Server normalizes ASCII spaces and case before uniqueness/overlap checks; e.g. 34 ABC
            123 -> 34ABC123. Existing plate belongs to one carrier; conflicting owner yields 409.
        vehicleType: &id037
          $ref: '#/components/schemas/VehicleType'
        capacityKg: &id038
          type: number
          exclusiveMinimum: 0
          description: Positive finite quantity. KG may be fractional; all other MVP units require whole numbers
            (server validation).
      required:
      - licensePlate
      - vehicleType
      - capacityKg
    Vehicle:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        carrierId:
          type: string
          minLength: 1
          maxLength: 100
        licensePlate: *id036
        vehicleType: *id037
        capacityKg: *id038
      required:
      - id
      - carrierId
      - licensePlate
      - vehicleType
      - capacityKg
    PledgeItem:
      type: object
      additionalProperties: false
      properties:
        itemId:
          type: string
          minLength: 1
          maxLength: 100
        quantity:
          type: number
          exclusiveMinimum: 0
          description: Positive finite quantity. KG may be fractional; all other MVP units require whole numbers
            (server validation).
      required:
      - itemId
      - quantity
      description: itemId references a Need in targetZoneId. Units come from that Need; do not match by free
        text.
    BookingInput:
      type: object
      additionalProperties: false
      properties:
        vehicle:
          $ref: '#/components/schemas/VehicleInput'
        targetZoneId:
          type: string
          minLength: 1
          maxLength: 100
        slotId:
          type: string
          minLength: 1
          maxLength: 100
        items:
          type: array
          items:
            $ref: '#/components/schemas/PledgeItem'
          minItems: 1
          maxItems: 50
      required:
      - vehicle
      - targetZoneId
      - slotId
      - items
      description: Upsert own vehicle by normalized plate and reserve atomically. Duplicate itemId invalid.
        Slot must belong to targetZoneId. Each pledge <= current openDeficit. No silent truncation; return
        409 NEED_EXCEEDED (A-02). capacityKg is metadata, not an automatic weight conversion for mixed units.
      examples:
      - *id039
    Shipment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        carrierId:
          type: string
          minLength: 1
          maxLength: 100
        vehicleId:
          type: string
          minLength: 1
          maxLength: 100
        licensePlate:
          type: string
        targetZoneId:
          type: string
          minLength: 1
          maxLength: 100
        slotId:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PledgeItem'
          minItems: 1
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
      required:
      - id
      - carrierId
      - vehicleId
      - licensePlate
      - targetZoneId
      - slotId
      - status
      - items
      - createdAt
      - updatedAt
      examples:
      - *id007
    BookingReceipt:
      type: object
      additionalProperties: false
      properties:
        shipment:
          $ref: '#/components/schemas/Shipment'
        verificationCode:
          $ref: '#/components/schemas/VerificationCode'
      required:
      - shipment
      - verificationCode
      examples:
      - *id008
    DepartureInput:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - IN_TRANSIT
      required:
      - status
      examples:
      - *id040
    DeliveryItem:
      type: object
      additionalProperties: false
      properties:
        itemId:
          type: string
          minLength: 1
          maxLength: 100
        actualDeliveredQuantity:
          type: number
          minimum: 0
      required:
      - itemId
      - actualDeliveredQuantity
      description: Every pledged item exactly once, including zero deliveries. No new items. Draft A-04 rejects
        actual > pledged; do not silently accept overdelivery.
    HandoverInput:
      type: object
      additionalProperties: false
      properties:
        shipmentId:
          type: string
          minLength: 1
          maxLength: 100
        licensePlate:
          type: string
          minLength: 5
          maxLength: 15
        verificationCode:
          $ref: '#/components/schemas/VerificationCode'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryItem'
          minItems: 1
          maxItems: 50
      required:
      - shipmentId
      - licensePlate
      - verificationCode
      - items
      examples:
      - *id041
    FallbackInput:
      type: object
      additionalProperties: false
      properties:
        shipmentId:
          type: string
          minLength: 1
          maxLength: 100
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryItem'
          minItems: 1
          maxItems: 50
        fallbackReason:
          type: string
          minLength: 10
          maxLength: 1000
      required:
      - shipmentId
      - items
      - fallbackReason
      examples:
      - *id042
    DeliveryReceipt:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        shipmentId:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum:
          - DELIVERED
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryItem'
          minItems: 1
        confirmedBy:
          type: string
          minLength: 1
          maxLength: 100
        source:
          type: string
          enum:
          - FIELD
          - COORDINATOR_FALLBACK
        deliveredAt:
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
      required:
      - id
      - shipmentId
      - status
      - items
      - confirmedBy
      - source
      - deliveredAt
      examples:
      - *id011
    StandbyInput:
      type: object
      additionalProperties: false
      properties:
        vehicle:
          $ref: '#/components/schemas/VehicleInput'
        currentCity:
          type: string
          minLength: 1
          maxLength: 100
        availableFrom:
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
        availableUntil:
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
      required:
      - vehicle
      - currentCity
      - availableFrom
      - availableUntil
      description: availableFrom < availableUntil. Existing own vehicle reused; conflicting owner or overlapping
        standby/booking yields 409.
      examples:
      - *id043
    Standby:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        vehicleId:
          type: string
          minLength: 1
          maxLength: 100
        carrierId:
          type: string
          minLength: 1
          maxLength: 100
        currentCity:
          type: string
        availableFrom:
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
        availableUntil:
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
        status:
          type: string
          enum:
          - STANDBY_AVAILABLE
          - ASSIGNED
      required:
      - id
      - vehicleId
      - carrierId
      - currentCity
      - availableFrom
      - availableUntil
      - status
      examples:
      - *id044
    StandbyAssignment:
      type: object
      additionalProperties: false
      properties:
        targetZoneId:
          type: string
          minLength: 1
          maxLength: 100
        slotId:
          type: string
          minLength: 1
          maxLength: 100
        items:
          type: array
          items:
            $ref: '#/components/schemas/PledgeItem'
          minItems: 1
          maxItems: 50
        pickupAddress:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - targetZoneId
      - slotId
      - items
      - pickupAddress
      description: Coordinator supplies real cargo/pickup information; no warehouse stock inferred. Slot must
        fit availability. Same atomic quota/need/overlap rules as carrier booking.
      examples:
      - *id045
    CancelInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason
      examples:
      - *id010
    RerouteInput:
      type: object
      additionalProperties: false
      properties:
        targetZoneId:
          type: string
          minLength: 1
          maxLength: 100
        slotId:
          type: string
          minLength: 1
          maxLength: 100
        reason:
          type: string
          minLength: 1
          maxLength: 500
        itemMappings:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              sourceItemId:
                type: string
                minLength: 1
                maxLength: 100
              targetItemId:
                type: string
                minLength: 1
                maxLength: 100
            required:
            - sourceItemId
            - targetItemId
          minItems: 1
          maxItems: 50
      required:
      - targetZoneId
      - slotId
      - reason
      - itemMappings
      description: IN_TRANSIT only. Exactly one mapping per pledged item. Target must have matching item semantics
        AND unit, enough deficit and compatible capacity. Reject same destination and duplicate mappings. One
        transaction transfers old reservations and appointment to new slot, preserves quantities/status, rotates
        verification code. No automatic nearest-safe-route guarantee. A-06 requires PO review.
      examples:
      - *id046
    VolunteerInput:
      type: object
      additionalProperties: false
      properties:
        zoneId: &id048
          type: string
          minLength: 1
          maxLength: 100
        shiftStartsAt: &id049
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
        shiftEndsAt: &id050
          type: string
          format: date-time
          description: RFC 3339 date-time including Z or explicit UTC offset. Compare instants after timezone
            normalization.
        contactPhone: &id051
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
      required:
      - zoneId
      - shiftStartsAt
      - shiftEndsAt
      - contactPhone
      description: Authenticated REPORTER or FIELD_STAFF applies for own account. Start < end; server validates
        active zone and future shift.
      examples:
      - *id047
    VolunteerApplication:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        userId:
          type: string
          minLength: 1
          maxLength: 100
        zoneId: *id048
        shiftStartsAt: *id049
        shiftEndsAt: *id050
        contactPhone: *id051
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
      required:
      - id
      - userId
      - zoneId
      - shiftStartsAt
      - shiftEndsAt
      - contactPhone
      - status
    VolunteerDecision:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - decision
      - reason
