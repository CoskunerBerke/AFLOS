  responses:
    BadRequest:
      description: One or more fields are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: One or more fields are invalid.
            requestId: req-example-001
    Unauthorized:
      description: Missing, invalid or expired bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHENTICATED
            message: Missing, invalid or expired bearer token.
            requestId: req-example-001
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
    Forbidden:
      description: Role, ownership or zone/shift scope does not allow this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Role, ownership or zone/shift scope does not allow this action.
            requestId: req-example-001
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: The requested resource was not found.
            requestId: req-example-001
    Conflict:
      description: No appointment capacity remains in this slot.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SLOT_FULL
            message: No appointment capacity remains in this slot.
            requestId: req-example-001
    TooManyRequests:
      description: Retry after the indicated delay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: Retry after the indicated delay.
            requestId: req-example-001
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          example: 60
