    AuditEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        actorId:
          type: string
          minLength: 1
          maxLength: 100
        actorRole:
          $ref: '#/components/schemas/Role'
