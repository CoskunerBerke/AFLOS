# AFLOS Sprint 1 OpenAPI Draft — latest PO decisions take precedence.
openapi: 3.1.0
info:
  title: AFLOS Disaster Logistics & Aid Coordination API
  version: 0.1.0
  summary: Sprint 1 reviewable API-first draft
  description: Prepared from PO decision message (2026-11-02) and updated US-01..US-10. Latest explicit PO
    decisions override stale prose in proposal/vision. Supporting operations and assumptions are marked for
    team review; see docs/architecture/03-openapi-draft-guide.md. This contract describes intended behavior,
    not an implemented server. All IDs are opaque server-issued strings. Errors use a shared envelope. Public
    endpoints never expose report contacts or verification codes. All operations require HTTPS in deployment.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
- url: http://localhost:8080/api/v1
  description: Proposed local demo server; no running service implied.
tags:
- name: Authentication
  description: Authentication operations.
- name: Public
  description: Public operations.
- name: Need requests
  description: Need requests operations.
- name: Aid zones
  description: Aid zones operations.
- name: Shipments
  description: Shipments operations.
- name: Handover
  description: Handover operations.
- name: Standby fleet
  description: Standby fleet operations.
- name: Volunteers
  description: Volunteers operations.
- name: Audit
  description: Audit operations.
security:
- bearerAuth: []
paths:
  /auth/token:
    post:
      operationId: createToken
      summary: Sign in to an existing account
      description: 'Supporting draft: seeded classroom accounts; no public role elevation. Returns short-lived
        JWT. Invalid credentials return 401; no username existence disclosure.'
      tags:
      - Authentication
      security: []
      x-roles:
      - PUBLIC
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scope: Supporting contract proposal; see review notes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example: &id054
              username: demo-carrier
              password: example-only-password
  /need-requests:
    post:
      operationId: submitNeedRequest
      summary: Submit a quarantined regional need request
      description: 'Anonymous or proxy reporting allowed. No public report-list endpoint. Receipt omits name
        and contact phone. Conflicts (409): IDEMPOTENCY_CONFLICT. Idempotency-Key is mandatory; same actor/method/path/key
        and payload replay the original result for 24 hours without repeated effects. Different payload with
        same key yields 409 IDEMPOTENCY_CONFLICT. Keys are atomically persisted with successful writes; replay
        rechecks current authorization.'
      tags:
      - Need requests
      security: []
      x-roles:
      - PUBLIC
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeedRequestReceipt'
              example: &id019
                id: REQ-1
                status: PENDING_VERIFICATION
                createdAt: '2026-11-04T10:00:00+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-user-stories:
      - US-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NeedRequestInput'
            example: &id018
              location: &id002
                lat: 36.2
                lng: 36.16
              disasterType: EARTHQUAKE
              contactPhone: '+905000000000'
              items:
              - category: WATER_BEVERAGE
                itemName: Su
                quantity: 100
                unit: CASE
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-conflict-codes:
      - IDEMPOTENCY_CONFLICT
    get:
      operationId: listNeedRequests
      summary: Review private need requests
      description: Coordinator-only contact data. Never publicly cache.
      tags:
      - Need requests
      security:
      - bearerAuth: []
      x-roles: &id001
      - COORDINATOR
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeedRequestList'
              example: &id056
                items: []
                page: 1
                pageSize: 20
                total: 0
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: Supporting contract proposal; see review notes.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING_VERIFICATION
          - VERIFIED
          - REJECTED
  /need-requests/{requestId}/review:
    post:
      operationId: reviewNeedRequest
      summary: Verify or reject a need report
      description: 'Verify or reject a need report Conflicts (409): INVALID_REPORT_STATE, IDEMPOTENCY_CONFLICT.
        Idempotency-Key is mandatory; same actor/method/path/key and payload replay the original result for
        24 hours without repeated effects. Different payload with same key yields 409 IDEMPOTENCY_CONFLICT.
        Keys are atomically persisted with successful writes; replay rechecks current authorization.'
      tags:
      - Need requests
      security:
      - bearerAuth: []
      x-roles: *id001
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeedRequest'
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: Supporting contract proposal; see review notes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewNeedRequest'
            example: &id025
              decision: VERIFIED
              reason: Verified by coordinator phone call.
              targetZoneId: Z-101
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - $ref: '#/components/parameters/IdempotencyKey'
      x-conflict-codes:
      - INVALID_REPORT_STATE
      - IDEMPOTENCY_CONFLICT
  /dashboard/summary:
    get:
      operationId: getDashboard
      summary: Read public counters and item progress
      description: Item progress remains scoped by zoneId and itemId. No category quantity totals. Read data
        may lag by 15 seconds; cache headers alone do not guarantee DDoS protection.
      tags:
      - Public
      security: []
      x-roles:
      - PUBLIC
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
              example: &id053
                activeZonesCount: 1
                inTransitVehiclesCount: 0
                deliveredShipmentsCount: 0
                generatedAt: '2026-11-04T10:00:00+03:00'
                itemProgress:
                - &id003
                  itemId: ITEM-1
                  zoneId: Z-101
                  category: WATER_BEVERAGE
                  itemName: 0.5L Icme Suyu
                  requiredQuantity: 1000
                  unit: CASE
                  reservedQuantity: 100
                  deliveredQuantity: 0
                  openDeficit: 900
                  remainingQuantity: 900
                  fulfillmentPercent: 0
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=15
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-user-stories:
      - US-02
  /aid-zones:
    get:
      operationId: listAidZones
      summary: List active public aid zones
      description: Only ACTIVE zones. category filters zones with at least one matching need. No reporter personal
        data.
      tags:
      - Public
      security: []
      x-roles:
      - PUBLIC
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneList'
              example: &id055
                items: []
                page: 1
                pageSize: 20
                total: 0
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=15
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-user-stories:
      - US-02
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: disasterType
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DisasterType'
      - name: category
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AidCategory'
    post:
      operationId: createAidZone
      summary: Create an aid zone and dated time slots
      description: 'Validate all dates and slots; create zone and slots atomically. No past or reversed intervals.
        Conflicts (409): OVERLAPPING_ZONE_SLOTS, IDEMPOTENCY_CONFLICT. Idempotency-Key is mandatory; same actor/method/path/key
        and payload replay the original result for 24 hours without repeated effects. Different payload with
        same key yields 409 IDEMPOTENCY_CONFLICT. Keys are atomically persisted with successful writes; replay
        rechecks current authorization.'
      tags:
      - Aid zones
      security:
      - bearerAuth: []
      x-roles: *id001
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneDetail'
              example: &id005
                id: Z-101
                zoneName: Hatay Antakya Spor Salonu
                location: *id002
                disasterType: EARTHQUAKE
                status: ACTIVE
                needs:
                - *id003
                timeSlots:
                - id: SLOT-1
                  zoneId: Z-101
                  startsAt: '2026-11-05T08:00:00+03:00'
                  endsAt: '2026-11-05T12:00:00+03:00'
                  maxVehicles: 5
                  allowedVehicleTypes: &id004
                  - TRUCK_TIR
                  - LORRY
                  assignedVehicles: 1
                  availableVehicles: 4
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-user-stories:
      - US-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneInput'
            example: &id030
              zoneName: Hatay Antakya Spor Salonu
              location: *id002
              disasterType: EARTHQUAKE
              timeSlots:
              - startsAt: '2026-11-05T08:00:00+03:00'
                endsAt: '2026-11-05T12:00:00+03:00'
                maxVehicles: 5
                allowedVehicleTypes: *id004
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-conflict-codes:
      - OVERLAPPING_ZONE_SLOTS
      - IDEMPOTENCY_CONFLICT
  /aid-zones/{zoneId}:
    get:
      operationId: getAidZone
      summary: Read active zone, item needs and time slots
      description: Inactive or unknown zone returns 404. Public data excludes contacts, plates and codes.
      tags:
      - Public
      security: []
      x-roles:
      - PUBLIC
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneDetail'
              example: *id005
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=15
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-user-stories:
      - US-02
      parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
  /aid-zones/{zoneId}/needs:
    post:
      operationId: createNeed
      summary: Add one categorized need line
      description: 'requiredQuantity > 0; initialize reservedQuantity and deliveredQuantity to zero. remainingQuantity
        aliases openDeficit. Conflicts (409): ZONE_INACTIVE, IDEMPOTENCY_CONFLICT. Idempotency-Key is mandatory;
        same actor/method/path/key and payload replay the original result for 24 hours without repeated effects.
        Different payload with same key yields 409 IDEMPOTENCY_CONFLICT. Keys are atomically persisted with
        successful writes; replay rechecks current authorization.'
      tags:
      - Aid zones
      security:
      - bearerAuth: []
      x-roles: *id001
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Need'
              example: *id003
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-user-stories:
      - US-04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NeedInput'
            example: &id013
              category: WATER_BEVERAGE
              itemName: 0.5L Icme Suyu
              requiredQuantity: 1000
              unit: CASE
      parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - $ref: '#/components/parameters/IdempotencyKey'
      x-conflict-codes:
      - ZONE_INACTIVE
      - IDEMPOTENCY_CONFLICT
  /aid-zones/{zoneId}/deactivate:
    post:
      operationId: deactivateZone
      summary: Deactivate a hazardous zone
      description: 'Blocks new reservations; does not delete records or automatically reroute vehicles. Existing
        shipments remain visible to authorized users. Conflicts (409): IDEMPOTENCY_CONFLICT. Idempotency-Key
        is mandatory; same actor/method/path/key and payload replay the original result for 24 hours without
        repeated effects. Different payload with same key yields 409 IDEMPOTENCY_CONFLICT. Keys are atomically
        persisted with successful writes; replay rechecks current authorization.'
      tags:
      - Aid zones
      security:
      - bearerAuth: []
      x-roles: *id001
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: Supporting contract proposal; see review notes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInput'
            example: &id010
              reason: Vehicle unavailable before departure.
      parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - $ref: '#/components/parameters/IdempotencyKey'
      x-conflict-codes:
      - IDEMPOTENCY_CONFLICT
  /carrier-applications:
    post:
      operationId: bookShipment
      summary: Book a confirmed appointment directly
      description: 'Historical path retained from backlog; this operation is an immediate booking, NOT an approval
        application. Atomically create/reuse own vehicle, check active zone, future slot, compatible type,
        plate overlap and every item deficit; consume one appointment and reserve every item, create CONFIRMED
        shipment and generate code. All-or-nothing, including concurrent calls. Active overlap uses CONFIRMED/IN_TRANSIT
        and half-open intervals. Do not accept client-supplied carrierId, status or code. Conflicts (409):
        SLOT_FULL, VEHICLE_OVERLAPPING_BOOKING, NEED_EXCEEDED, VEHICLE_TYPE_NOT_ALLOWED, VEHICLE_OWNERSHIP_CONFLICT,
        ZONE_INACTIVE, SLOT_CLOSED, IDEMPOTENCY_CONFLICT. Idempotency-Key is mandatory; same actor/method/path/key
        and payload replay the original result for 24 hours without repeated effects. Different payload with
        same key yields 409 IDEMPOTENCY_CONFLICT. Keys are atomically persisted with successful writes; replay
        rechecks current authorization.'
      tags:
      - Shipments
      security:
      - bearerAuth: []
      x-roles: &id009
      - CARRIER
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingReceipt'
              example: &id008
                shipment: &id007
                  id: SHP-101
                  carrierId: USR-10
                  vehicleId: VEH-1
                  licensePlate: 34ABC123
                  targetZoneId: Z-101
                  slotId: SLOT-1
                  status: CONFIRMED
                  items: &id006
                  - itemId: ITEM-1
                    quantity: 100
                  createdAt: '2026-11-04T10:00:00+03:00'
                  updatedAt: '2026-11-04T10:00:00+03:00'
                verificationCode: AFL-7K49P2
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-user-stories:
      - US-05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
            example: &id039
              vehicle: &id012
                licensePlate: 34 ABC 123
                vehicleType: TRUCK_TIR
                capacityKg: 12000
              targetZoneId: Z-101
              slotId: SLOT-1
              items: *id006
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-conflict-codes:
      - SLOT_FULL
      - VEHICLE_OVERLAPPING_BOOKING
      - NEED_EXCEEDED
      - VEHICLE_TYPE_NOT_ALLOWED
      - VEHICLE_OWNERSHIP_CONFLICT
      - ZONE_INACTIVE
      - SLOT_CLOSED
      - IDEMPOTENCY_CONFLICT
  /shipments:
    get:
      operationId: listShipments
      summary: List authorized operational shipments
      description: Carrier sees own shipments; FIELD_STAFF only assigned zone and active shift; coordinator
        sees all. Forbidden explicit zone scope yields 403. Verification codes never included.
      tags:
      - Shipments
      security:
      - bearerAuth: []
      x-roles:
      - CARRIER
      - COORDINATOR
      - FIELD_STAFF
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentList'
              example: &id057
                items: []
                page: 1
                pageSize: 20
                total: 0
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: Supporting contract proposal; see review notes.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: zoneId
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ShipmentStatus'
  /shipments/{shipmentId}:
    get:
      operationId: getShipment
      summary: Read an authorized shipment
      description: Enforce ownership or zone/shift assignment on every request, not only token claims. No verification
        code.
      tags:
      - Shipments
      security:
      - bearerAuth: []
      x-roles:
      - CARRIER
      - COORDINATOR
      - FIELD_STAFF
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
              example: *id007
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: Supporting contract proposal; see review notes.
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
  /shipments/{shipmentId}/verification-code:
    get:
      operationId: getVerificationCode
      summary: Retrieve the current shipment handover code
      description: 'Carrier owner or coordinator only; active shipment only (otherwise 409). Never log code
        or cache response. Conflicts (409): INVALID_SHIPMENT_STATE.'
      tags:
      - Shipments
      security:
      - bearerAuth: []
      x-roles:
      - CARRIER
      - COORDINATOR
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingReceipt'
              example: *id008
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: Supporting contract proposal; see review notes.
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
      x-conflict-codes:
      - INVALID_SHIPMENT_STATE
  /shipments/{shipmentId}/status:
    patch:
      operationId: departShipment
      summary: Mark an owned confirmed shipment as in transit
      description: 'Only CONFIRMED -> IN_TRANSIT. Other transitions rejected. Does not reserve quantities again.
        Conflicts (409): INVALID_SHIPMENT_STATE, IDEMPOTENCY_CONFLICT. Idempotency-Key is mandatory; same actor/method/path/key
