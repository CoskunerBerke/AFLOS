name: AFLOS CI Pipeline

on:
  push:
    branches: [ "main", "develop", "role/**", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate-deliverables-and-contracts:
    name: Sprint 1 & Sprint 2 Deliverable, Architecture & OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenAPI Validation Dependencies
        run: |
          if [ -f "tools/requirements-openapi.txt" ]; then
            pip install -r tools/requirements-openapi.txt
          fi

      - name: Verify Sprint 1 & Sprint 2 Deliverables & Architecture Artifacts
        run: |
          REQUIRED_FILES=(
            "docs/requirements/01-project-proposal.md"
            "docs/requirements/02-system-vision-and-boundary.md"
            "docs/requirements/06-initial-product-backlog.md"
            "docs/requirements/06-refined-product-backlog.md"
            "docs/requirements/07-software-requirements-specification.md"
            "docs/requirements/08-non-functional-requirements.md"
            "docs/requirements/09-user-flows-and-ui-spec.md"
            "api/openapi.yaml"
            "docs/architecture/03-openapi-draft-guide.md"
            "docs/architecture/c4_model.md"
            "docs/architecture/uml_diagrams.md"
            "docs/architecture/uml_schema_proposal.sql"
            "docs/quality/nfr_quality_measures.md"
            "docs/ui_ux/figma_prototype.md"
            "docs/scrum/04-raci-matrix.md"
            "docs/scrum/04-meeting-minutes.md"
            "docs/agile/raci_matrix_sprint2.md"
            "docs/agile/sprint2_ceremonies.md"
            "docs/agile/impediment_log.md"
            "docs/submissions/sprint2_submission_manifest.md"
            "docs/git_flow_rules.md"
            ".github/workflows/ci.yml"
            "CONTRIBUTIONS.md"
            "README.md"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required project deliverable file: $file"
              exit 1
            fi
          done
          echo "All Sprint 1 and Sprint 2 deliverables, architecture models, and governance artifacts verified."

      - name: Validate OpenAPI 3.1.0 Contract
        run: |
          python tools/validate_openapi.py
